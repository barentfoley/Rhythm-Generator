<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Rhythm & Notation Builder</title>
  <script src="https://cdn.jsdelivr.net/npm/vexflow@4.2.2/build/cjs/vexflow.js"></script>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --accent: #2563eb;
      --border: #e2e8f0;
      --text: #1e293b;
      --selected: #3b82f6;
    }

    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
      overflow-x: hidden;
      overflow-y: auto;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 12px;
    }

    .container {
      background: var(--card);
      border-radius: 14px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
      padding: 16px;
      width: 100%;
      max-width: 960px;
      position: relative;
    }

    .header-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    h2 {
      margin: 0;
      font-size: 1.2rem;
      font-weight: 700;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .icon-btn {
      background: #f1f5f9;
      border: 1px solid var(--border);
      border-radius: 8px;
      width: 38px;
      height: 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #475569;
      transition: background 0.15s ease;
    }

    .icon-btn:hover {
      background: #e2e8f0;
    }

    .settings-panel {
      display: none;
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 14px;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
    }

    .settings-panel.open {
      display: grid;
    }

    .controls-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 8px;
      margin-bottom: 12px;
    }

    label {
      font-size: 0.78rem;
      font-weight: 600;
      display: block;
      margin-bottom: 4px;
      color: #475569;
    }

    input, select {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 15px;
      background-color: #fff;
      color: var(--text);
      appearance: none;
      -webkit-appearance: none;
    }

    select {
      background-image: url("data:image/svg+xml;charset=UTF-8,%3Csvg width='12' height='8' viewBox='0 0 12 8' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1.5L6 6.5L11 1.5' stroke='%2364748B' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
      background-repeat: no-repeat;
      background-position: right 10px center;
      padding-right: 28px;
    }

    .time-sig-group {
      display: flex;
      gap: 4px;
      align-items: center;
    }

    .time-sig-group span {
      font-weight: 700;
      color: #64748b;
    }

    .toggle-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 38px;
    }

    .toggle-switch {
      position: relative;
      display: inline-block;
      width: 40px;
      height: 22px;
    }

    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #cbd5e1;
      transition: .2s;
      border-radius: 22px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 16px;
      width: 16px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .2s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: var(--accent);
    }

    input:checked + .slider:before {
      transform: translateX(18px);
    }

    #stringInputWrapper {
      display: none;
      margin-bottom: 10px;
    }

    .palette {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      margin: 10px 0;
    }

    .palette button {
      background: #f1f5f9;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 4px 8px;
      cursor: pointer;
      font-size: 0.82rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      min-width: 44px;
      touch-action: manipulation;
      transition: all 0.15s ease;
    }

    .palette button:hover {
      background: #e2e8f0;
    }

    .palette button:active {
      transform: scale(0.97);
    }

    .palette button.active-modifier {
      background: #dbeafe;
      border-color: #3b82f6;
      color: #1d4ed8;
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
    }

    .palette button.beam-tool {
      background: #e0e7ff;
      border-color: #c7d2fe;
      color: #3730a3;
      font-weight: 600;
    }

    .palette button.beam-tool:hover {
      background: #4338ca;
      color: #ffffff;
    }

    .palette button.edit-btn {
      background: #f8fafc;
      font-weight: 600;
      color: #475569;
    }

    .note-btn svg {
      vertical-align: middle;
      display: inline-block;
      overflow: visible;
      pointer-events: none;
    }

    .notation-wrapper {
      position: relative;
      margin-top: 10px;
    }

    #notation-output {
      background: #fff;
      border: 1px dashed var(--border);
      border-radius: 10px;
      display: flex;
      align-items: center;
      min-height: 160px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      padding: 8px;
    }

    #notation-output.centered-canvas svg {
      margin: 0 auto;
      display: block;
    }

    .fullscreen-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #ffffff;
      z-index: 99999;
      padding: 40px 20px;
      box-sizing: border-box;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: auto;
    }

    .fullscreen-overlay.active {
      display: flex;
    }

    .fullscreen-close-btn {
      position: absolute;
      top: 16px;
      right: 16px;
      background: #f1f5f9;
      border: 1px solid var(--border);
      border-radius: 50%;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #334155;
    }

    .fullscreen-canvas {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: auto;
    }

    .vf-clickable-note {
      cursor: pointer;
      touch-action: manipulation;
    }

    .vf-clickable-note.selected path,
    .vf-clickable-note.selected ellipse,
    .vf-clickable-note.selected rect {
      fill: var(--selected) !important;
      stroke: var(--selected) !important;
    }

    .actions {
      display: flex;
      flex-direction: row;
      gap: 8px;
      margin-top: 12px;
    }

    .btn-primary, .btn-secondary {
      flex: 1;
      min-height: 42px;
      border: none;
      border-radius: 8px;
      padding: 8px 12px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      text-align: center;
      touch-action: manipulation;
    }

    .btn-primary {
      background: var(--accent);
      color: white;
    }

    .btn-primary:active {
      background: #1d4ed8;
    }

    .btn-secondary {
      background: #e2e8f0;
      color: var(--text);
    }

    .btn-secondary:active {
      background: #cbd5e1;
    }
  </style>
</head>
<body>

<div class="container" onclick="handleContainerClick(event)">
  <div class="header-bar">
    <h2>Rhythm Builder</h2>
    <div class="header-actions">
      <button class="icon-btn" onclick="openFullscreen(event)" aria-label="Fullscreen" title="Fullscreen">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
        </svg>
      </button>
      <button class="icon-btn" onclick="toggleSettings(event)" aria-label="Settings" title="Settings">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </div>
  </div>

  <div class="settings-panel" id="settingsPanel">
    <div>
      <label for="beamMode">Beaming Mode</label>
      <select id="beamMode" onchange="renderScore()">
        <option value="auto">Auto (Metric Rules)</option>
        <option value="manual">Manual ([Brackets])</option>
      </select>
    </div>

    <div>
      <label for="buttonDisplayMode">Palette Buttons</label>
      <select id="buttonDisplayMode" onchange="updatePaletteButtons()">
        <option value="graphic">Graphic Note Icons</option>
        <option value="text">Text Labels (Code)</option>
      </select>
    </div>

    <div>
      <label for="exportBgMode">Export Background</label>
      <select id="exportBgMode">
        <option value="white">White Card Background</option>
        <option value="transparent">Transparent Background</option>
      </select>
    </div>

    <div class="toggle-container">
      <label for="toggleManualBeamTool" style="margin-bottom:0;">Show Beam Tool</label>
      <label class="toggle-switch">
        <input type="checkbox" id="toggleManualBeamTool" onchange="updatePaletteButtons()">
        <span class="slider"></span>
      </label>
    </div>

    <div class="toggle-container">
      <label for="toggleStringInput" style="margin-bottom:0;">Show Rhythm String</label>
      <label class="toggle-switch">
        <input type="checkbox" id="toggleStringInput" onchange="toggleStringVisibility()">
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <div class="controls-grid">
    <div>
      <label for="clef">Clef Type</label>
      <select id="clef" onchange="handleClefChange()">
        <option value="treble">Treble Clef (5 lines)</option>
        <option value="bass">Bass Clef (5 lines)</option>
        <option value="percussion" selected>Rhythm Clef (Middle Line)</option>
      </select>
    </div>

    <div>
      <label>Time Signature</label>
      <div class="time-sig-group">
        <select id="timeSigTop" onchange="renderScore()">
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4" selected>4</option>
          <option value="5">5</option>
          <option value="6">6</option>
          <option value="7">7</option>
          <option value="8">8</option>
          <option value="9">9</option>
          <option value="10">10</option>
          <option value="11">11</option>
          <option value="12">12</option>
          <option value="13">13</option>
          <option value="14">14</option>
          <option value="15">15</option>
          <option value="16">16</option>
        </select>
        <span>/</span>
        <select id="timeSigBottom" onchange="renderScore()">
          <option value="2">2</option>
          <option value="4" selected>4</option>
          <option value="8">8</option>
          <option value="16">16</option>
        </select>
      </div>
    </div>

    <div id="pitch-container">
      <label for="pitch">Staff Position / Pitch</label>
      <select id="pitch" onchange="renderScore()"></select>
    </div>
  </div>

  <div id="stringInputWrapper">
    <label for="rhythmInput">Rhythm String</label>
    <input type="text" id="rhythmInput" value="" autocorrect="off" autocapitalize="none" spellcheck="false" oninput="handleManualStringInput()" />
  </div>

  <div class="palette" id="notePalette"></div>

  <div class="notation-wrapper">
    <div id="notation-output" class="centered-canvas"></div>
  </div>

  <div class="actions">
    <button class="btn-primary" onclick="exportPNG()">Download PNG</button>
    <button class="btn-secondary" onclick="exportSVG()">Download SVG</button>
  </div>
</div>

<div class="fullscreen-overlay" id="fullscreenOverlay">
  <button class="fullscreen-close-btn" onclick="closeFullscreen()" aria-label="Close Fullscreen" title="Exit Fullscreen">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="18" y1="6" x2="6" y2="18"></line>
      <line x1="6" y1="6" x2="18" y2="18"></line>
    </svg>
  </button>
  <div class="fullscreen-canvas" id="fullscreenCanvas"></div>
</div>

<script>
  const { Renderer, Stave, StaveNote, Dot, Formatter, Beam, StaveTie, Barline } = Vex.Flow;

  const defaultPresets = [
    'h, q, 8, 16, 16, 8, 8~, q, q., 8',
    '8, 8~, q, 8r, 8, q, qr, q, h',
    '8, 16, 16, 16, 16, 8, 8r, 8, 8., 16, 16, 16, 8, q, hr'
  ];

  const baseBeatValues = {
    'w': 4,
    'h': 2,
    'q': 1,
    '8': 0.5,
    '16': 0.25
  };

  const standardDurations = [
    { durType: 'w',  beatValue: 4,    isDotted: false },
    { durType: 'h.', beatValue: 3,    isDotted: true,  baseType: 'h' },
    { durType: 'h',  beatValue: 2,    isDotted: false },
    { durType: 'q.', beatValue: 1.5,  isDotted: true,  baseType: 'q' },
    { durType: 'q',  beatValue: 1,    isDotted: false },
    { durType: '8.', beatValue: 0.75, isDotted: true,  baseType: '8' },
    { durType: '8',  beatValue: 0.5,  isDotted: false },
    { durType: '16', beatValue: 0.25, isDotted: false }
  ];

  const paletteDefinitions = [
    { token: 'w',  name: 'Whole',        vexDuration: 'w',  isRest: false },
    { token: 'h',  name: 'Half',         vexDuration: 'h',  isRest: false },
    { token: 'q',  name: 'Quarter',      vexDuration: 'q',  isRest: false },
    { token: '8',  name: '8th',          vexDuration: '8',  isRest: false },
    { token: '16', name: '16th',         vexDuration: '16', isRest: false },
    { token: 'wr', name: 'Whole Rest',   vexDuration: 'wr', isRest: true, restType: 'w' },
    { token: 'hr', name: 'Half Rest',    vexDuration: 'hr', isRest: true, restType: 'h' },
    { token: 'qr', name: 'Quarter Rest', vexDuration: 'qr', isRest: true, restType: 'q' },
    { token: '8r', name: '8th Rest',     vexDuration: '8r', isRest: true, restType: '8' }
  ];

  const clefPitches = {
    treble: [
      { label: 'B4 (Middle Line)', value: 'b/4' },
      { label: 'G4 (Treble Clef G)', value: 'g/4' },
      { label: 'C5 (Third Space)', value: 'c/5' }
    ],
    bass: [
      { label: 'D3 (Middle Line)', value: 'd/3' },
      { label: 'F3 (Bass Clef F)', value: 'f/3' },
      { label: 'A2 (First Space)', value: 'a/2' }
    ],
    percussion: [
      { label: 'B4 (Middle Line)', value: 'b/4' }
    ]
  };

  let isDotModifierActive = false;
  let selectedTokenIndex = null;
  let historyStack = [];
  let isUndoRedoAction = false;

  function pushHistory() {
    if (isUndoRedoAction) return;
    const currentVal = document.getElementById('rhythmInput').value;
    if (historyStack.length === 0 || historyStack[historyStack.length - 1] !== currentVal) {
      historyStack.push(currentVal);
      if (historyStack.length > 50) historyStack.shift();
    }
  }

  function handleUndo() {
    if (historyStack.length <= 1) return;
    isUndoRedoAction = true;
    historyStack.pop();
    const prev = historyStack[historyStack.length - 1];
    document.getElementById('rhythmInput').value = prev;
    selectedTokenIndex = null;
    renderScore();
    isUndoRedoAction = false;
  }

  function handleManualStringInput() {
    pushHistory();
    renderScore();
  }

  function toggleSettings(e) {
    if (e) e.stopPropagation();
    const panel = document.getElementById('settingsPanel');
    panel.classList.toggle('open');
  }

  function toggleStringVisibility() {
    const isChecked = document.getElementById('toggleStringInput').checked;
    document.getElementById('stringInputWrapper').style.display = isChecked ? 'block' : 'none';
  }

  function toggleDotModifier() {
    isDotModifierActive = !isDotModifierActive;
    updatePaletteButtons();
  }

  function openFullscreen(e) {
    if (e) e.stopPropagation();
    const overlay = document.getElementById('fullscreenOverlay');
    const fsCanvas = document.getElementById('fullscreenCanvas');
    overlay.classList.add('active');
    fsCanvas.innerHTML = '';
    renderScoreToTarget(fsCanvas, true);
  }

  function closeFullscreen() {
    document.getElementById('fullscreenOverlay').classList.remove('active');
  }

  window.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeFullscreen();
    if ((e.ctrlKey || e.metaKey) && (e.key === 'z' || e.key === 'Z')) {
      e.preventDefault();
      handleUndo();
    }
    if ((e.key === 'Backspace' || e.key === 'Delete') && selectedTokenIndex !== null) {
      e.preventDefault();
      handleBackspace();
    }
  });

  function handleContainerClick(e) {
    if (e.target.closest('.vf-clickable-note') || e.target.closest('.palette button')) return;
    if (selectedTokenIndex !== null) {
      selectedTokenIndex = null;
      renderScore();
    }
  }

  function createVexflowButtonIcon(vexDuration, isDotted, isRest, restType) {
    const tempDiv = document.createElement('div');
    const width = isDotted ? 42 : 36;
    const height = 46;

    const renderer = new Renderer(tempDiv, Renderer.Backends.SVG);
    renderer.resize(width, height);
    const ctx = renderer.getContext();

    let staveY = -24;
    let staveX = -6;

    if (vexDuration === 'w') {
      staveY = -12;
      staveX = -4;
    } else if (isRest) {
      if (restType === 'w') staveY = -27;
      else if (restType === 'h') staveY = -38;
      else staveY = -42;
    }

    const stave = new Stave(staveX, staveY, width + 18);
    stave.setBegBarType(Barline.type.NONE);
    stave.setEndBarType(Barline.type.NONE);

    if (isRest && restType === 'h') {
      stave.options.num_lines = 5;
      stave.setConfigForLines([
        { visible: false },
        { visible: false },
        { visible: true },
        { visible: false },
        { visible: false }
      ]);
    } else {
      stave.options.num_lines = 0;
    }

    stave.setContext(ctx).draw();

    const note = new StaveNote({
      keys: ['b/4'],
      duration: vexDuration,
      clef: 'treble'
    });

    if (isDotted) {
      Dot.buildAndAttach([note], { all: true });
    }

    Formatter.FormatAndDraw(ctx, stave, [note]);

    const svg = tempDiv.querySelector('svg');
    if (svg) {
      svg.querySelectorAll('rect').forEach(rect => {
        const h = parseFloat(rect.getAttribute('height') || '0');
        const w = parseFloat(rect.getAttribute('width') || '0');
        if (h > 15 && w < 4) rect.remove();
      });

      svg.querySelectorAll('path').forEach(p => {
        const d = p.getAttribute('d') || '';
        if ((d.startsWith('M0') || d.includes('V40') || d.includes('V-40')) && !(isRest && restType === 'h')) {
          p.remove();
        }
      });

      svg.style.overflow = 'visible';
      svg.style.width = width + 'px';
      svg.style.height = height + 'px';
      return svg.outerHTML;
    }
    return '';
  }

  function createTiedQuarterIcon() {
    const tempDiv = document.createElement('div');
    const width = 52;
    const height = 46;

    const renderer = new Renderer(tempDiv, Renderer.Backends.SVG);
    renderer.resize(width, height);
    const ctx = renderer.getContext();

    const stave = new Stave(-4, -14, width + 12);
    stave.options.num_lines = 0;
    stave.setBegBarType(Barline.type.NONE);
    stave.setEndBarType(Barline.type.NONE);
    stave.setContext(ctx).draw();

    const note1 = new StaveNote({ keys: ['b/4'], duration: 'q', clef: 'treble', stem_direction: 1 });
    const note2 = new StaveNote({ keys: ['b/4'], duration: 'q', clef: 'treble', stem_direction: 1 });

    Formatter.FormatAndDraw(ctx, stave, [note1, note2]);

    const tie = new StaveTie({
      first_note: note1,
      last_note: note2,
      first_indices: [0],
      last_indices: [0]
    });
    tie.setDirection(1);
    tie.setContext(ctx).draw();

    const svg = tempDiv.querySelector('svg');
    if (svg) {
      svg.querySelectorAll('rect').forEach(r => r.remove());
      svg.style.overflow = 'visible';
      svg.style.width = width + 'px';
      svg.style.height = height + 'px';
      return svg.outerHTML;
    }
    return '';
  }

  function updatePaletteButtons() {
    const mode = document.getElementById('buttonDisplayMode').value;
    const palette = document.getElementById('notePalette');
    palette.innerHTML = '';

    const dotBtn = document.createElement('button');
    dotBtn.className = 'note-btn' + (isDotModifierActive ? ' active-modifier' : '');
    dotBtn.onclick = toggleDotModifier;
    dotBtn.innerHTML = `<span style="font-size: 1.4rem; line-height: 1; font-weight: bold;">•</span><span style="margin-left: 4px; font-weight: 600;">Dot</span>`;
    dotBtn.title = "Toggle dotted rhythm on/off";
    palette.appendChild(dotBtn);

    paletteDefinitions.forEach(item => {
      const btn = document.createElement('button');
      btn.className = 'note-btn';
      btn.onclick = () => handlePaletteNoteClick(item.token);

      if (mode === 'graphic') {
        const iconSvg = createVexflowButtonIcon(item.vexDuration, isDotModifierActive, item.isRest, item.restType);
        btn.innerHTML = `${iconSvg}`;
        btn.title = `${item.name} (${item.token})`;
      } else {
        const dotSuffix = isDotModifierActive ? '.' : '';
        btn.textContent = `${item.name} (${item.token}${dotSuffix})`;
      }
      palette.appendChild(btn);
    });

    const tieBtn = document.createElement('button');
    tieBtn.onclick = addTieToLast;
    const tieIconSvg = createTiedQuarterIcon();
    tieBtn.innerHTML = `${tieIconSvg}<span style="margin-left: 2px; font-weight:600;">Tie</span>`;
    palette.appendChild(tieBtn);

    const showBeamTool = document.getElementById('toggleManualBeamTool').checked;
    if (showBeamTool) {
      const beamBtn = document.createElement('button');
      beamBtn.className = 'beam-tool';
      beamBtn.onclick = beamLastTwoNotes;
      beamBtn.textContent = '[Beam Last 2]';
      palette.appendChild(beamBtn);

      const unbeamBtn = document.createElement('button');
      unbeamBtn.className = 'beam-tool';
      unbeamBtn.onclick = unbeamLastGroup;
      unbeamBtn.textContent = '[Unbeam Last Group]';
      palette.appendChild(unbeamBtn);
    }

    const backspaceBtn = document.createElement('button');
    backspaceBtn.className = 'edit-btn';
    backspaceBtn.onclick = handleBackspace;
    backspaceBtn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"></path><line x1="18" y1="9" x2="12" y2="15"></line><line x1="12" y1="9" x2="18" y2="15"></line></svg><span style="margin-left: 4px;">Delete</span>`;
    backspaceBtn.title = "Turn note into rest or remove end";
    palette.appendChild(backspaceBtn);

    const undoBtn = document.createElement('button');
    undoBtn.className = 'edit-btn';
    undoBtn.onclick = handleUndo;
    undoBtn.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"></path><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"></path></svg><span style="margin-left: 4px;">Undo</span>`;
    undoBtn.title = "Undo last action";
    palette.appendChild(undoBtn);

    const clearBtn = document.createElement('button');
    clearBtn.style.color = '#ef4444';
    clearBtn.onclick = clearRhythm;
    clearBtn.textContent = 'Clear';
    palette.appendChild(clearBtn);
  }

  function handleClefChange() {
    const clef = document.getElementById('clef').value;
    const pitchSelect = document.getElementById('pitch');
    pitchSelect.innerHTML = '';

    clefPitches[clef].forEach(opt => {
      const el = document.createElement('option');
      el.value = opt.value;
      el.textContent = opt.label;
      pitchSelect.appendChild(el);
    });

    document.getElementById('pitch-container').style.display = (clef === 'percussion') ? 'none' : 'block';
    renderScore();
  }

  function decomposeDuration(totalBeats, isRest) {
    const pieces = [];
    let remaining = totalBeats;

    while (remaining > 0.0001) {
      const match = standardDurations.find(d => d.beatValue <= remaining + 0.0001);
      if (!match) break;

      const durCode = match.isDotted ? match.baseType : match.durType;
      pieces.push({
        durType: durCode,
        vexDuration: durCode + (isRest ? 'r' : ''),
        isRest: isRest,
        isDotted: match.isDotted,
        beatValue: match.beatValue
      });
      remaining -= match.beatValue;
    }
    return pieces;
  }

  function parseDurationToken(token, forcedGroup = null) {
    let clean = token.trim();
    const hasTie = clean.endsWith('~');
    if (hasTie) clean = clean.slice(0, -1);

    const isRest = clean.endsWith('r');
    let durType = isRest ? clean.slice(0, -1) : clean;

    const isDotted = durType.endsWith('.');
    if (isDotted) durType = durType.slice(0, -1);

    const baseVal = baseBeatValues[durType] || 1;
    const beatValue = isDotted ? baseVal * 1.5 : baseVal;

    return {
      raw: token,
      durType,
      vexDuration: durType + (isRest ? 'r' : ''),
      isRest,
      isDotted,
      hasTie,
      beatValue,
      forcedGroup
    };
  }

  function getMeasureCapacityInQuarterBeats() {
    const num = parseInt(document.getElementById('timeSigTop').value, 10) || 4;
    const den = parseInt(document.getElementById('timeSigBottom').value, 10) || 4;
    return num * (4 / den);
  }

  function parseInputToTokens(inputStr) {
    const results = [];
    const tokens = [];
    const regex = /\[[^\]]+\]|[^,\s]+/g;
    let match;
    while ((match = regex.exec(inputStr)) !== null) {
      tokens.push(match[0].trim());
    }

    let groupCounter = 1;
    tokens.forEach(tok => {
      if (tok.startsWith('[') && tok.endsWith(']')) {
        const inner = tok.slice(1, -1).split(',').map(s => s.trim()).filter(Boolean);
        inner.forEach(item => {
          results.push(parseDurationToken(item, groupCounter));
        });
        groupCounter++;
      } else {
        results.push(parseDurationToken(tok, null));
      }
    });

    return results;
  }

  function reconstructRhythmString(parsedArray) {
    const tokens = [];
    let i = 0;
    while (i < parsedArray.length) {
      const p = parsedArray[i];
      if (p.forcedGroup) {
        const currentGroup = p.forcedGroup;
        const groupNotes = [];
        while (i < parsedArray.length && parsedArray[i].forcedGroup === currentGroup) {
          groupNotes.push(p.raw);
          i++;
        }
        tokens.push(`[${groupNotes.join(', ')}]`);
      } else {
        tokens.push(p.raw);
        i++;
      }
    }
    return tokens.join(', ');
  }

  function handlePaletteNoteClick(baseToken) {
    let token = baseToken;
    if (isDotModifierActive && !token.endsWith('r') && !token.endsWith('.')) {
      token += '.';
    }

    const input = document.getElementById('rhythmInput');
    const parsed = parseInputToTokens(input.value);

    if (selectedTokenIndex !== null && selectedTokenIndex >= 0 && selectedTokenIndex < parsed.length) {
      const hasTie = parsed[selectedTokenIndex].hasTie;
      const fg = parsed[selectedTokenIndex].forcedGroup;
      const newTokenObj = parseDurationToken(token + (hasTie ? '~' : ''), fg);
      parsed[selectedTokenIndex] = newTokenObj;
      input.value = reconstructRhythmString(parsed);
      pushHistory();
      renderScore();
      return;
    }

    const parts = input.value.split(',').map(s => s.trim()).filter(Boolean);
    parts.push(token);
    input.value = parts.join(', ');
    pushHistory();
    renderScore();
  }

  function handleBackspace() {
    const input = document.getElementById('rhythmInput');
    const parsed = parseInputToTokens(input.value);
    if (parsed.length === 0) return;

    if (selectedTokenIndex !== null && selectedTokenIndex >= 0 && selectedTokenIndex < parsed.length) {
      const target = parsed[selectedTokenIndex];
      if (!target.isRest) {
        let restToken = target.durType + 'r';
        parsed[selectedTokenIndex] = parseDurationToken(restToken, null);
        input.value = reconstructRhythmString(parsed);
        pushHistory();
        renderScore();
      }
      return;
    }

    parsed.pop();
    input.value = reconstructRhythmString(parsed);
    pushHistory();
    renderScore();
  }

  function addTieToLast() {
    const input = document.getElementById('rhythmInput');
    const parsed = parseInputToTokens(input.value);
    if (parsed.length === 0) return;

    const idx = (selectedTokenIndex !== null) ? selectedTokenIndex : parsed.length - 1;
    if (parsed[idx] && !parsed[idx].isRest) {
      if (!parsed[idx].raw.endsWith('~')) {
        parsed[idx].raw += '~';
        input.value = reconstructRhythmString(parsed);
        pushHistory();
        renderScore();
      }
    }
  }

  function clearRhythm() {
    document.getElementById('rhythmInput').value = '';
    selectedTokenIndex = null;
    pushHistory();
    renderScore();
  }

  function beamLastTwoNotes() {
    const parsed = parseInputToTokens(document.getElementById('rhythmInput').value);
    if (parsed.length < 2) return;

    let count = 0;
    let idx1 = -1, idx2 = -1;

    for (let i = parsed.length - 1; i >= 0; i--) {
      if (!parsed[i].isRest && (parsed[i].durType === '8' || parsed[i].durType === '16')) {
        if (count === 0) idx2 = i;
        else if (count === 1) { idx1 = i; break; }
        count++;
      }
    }

    if (idx1 !== -1 && idx2 !== -1 && idx2 - idx1 === 1) {
      const newGroupId = Date.now();
      parsed[idx1].forcedGroup = newGroupId;
      parsed[idx2].forcedGroup = newGroupId;
      document.getElementById('beamMode').value = 'manual';
      document.getElementById('rhythmInput').value = reconstructRhythmString(parsed);
      pushHistory();
      renderScore();
    }
  }

  function unbeamLastGroup() {
    const parsed = parseInputToTokens(document.getElementById('rhythmInput').value);
    for (let i = parsed.length - 1; i >= 0; i--) {
      if (parsed[i].forcedGroup) {
        const targetGroup = parsed[i].forcedGroup;
        parsed.forEach(p => {
          if (p.forcedGroup === targetGroup) p.forcedGroup = null;
        });
        break;
      }
    }
    document.getElementById('rhythmInput').value = reconstructRhythmString(parsed);
    pushHistory();
    renderScore();
  }

  function handleNoteSelect(sourceTokenIndex, e) {
    if (e) e.stopPropagation();
    if (selectedTokenIndex === sourceTokenIndex) {
      selectedTokenIndex = null;
    } else {
      selectedTokenIndex = sourceTokenIndex;
    }
    renderScore();
  }

  function calculateAutoBeamGroups(measureParsedNotes, timeSigTop, timeSigBottom) {
    const beamGroups = [];
    let currentBeam = [];
    let currentBeatBoundary = 0;

    let beatUnit = (timeSigBottom === 8 && timeSigTop % 3 === 0) ? 1.5 : (4 / timeSigBottom);
    const is44 = (timeSigTop === 4 && timeSigBottom === 4);

    let currentPos = 0;
    measureParsedNotes.forEach((p, idx) => {
      const isSubdivision = (p.durType === '8' || p.durType === '16') && !p.isRest;
      const noteStart = currentPos;
      const noteEnd = currentPos + p.beatValue;

      if (!isSubdivision) {
        if (currentBeam.length > 1) beamGroups.push([...currentBeam]);
        currentBeam = [];
      } else {
        let targetBoundary = Math.floor(noteStart / beatUnit) * beatUnit + beatUnit;

        if (is44) {
          const halfMeasure = noteStart < 2 ? 2.0 : 4.0;
          const notesInHalf = measureParsedNotes.filter((n, i) => {
            const pos = measureParsedNotes.slice(0, i).reduce((sum, item) => sum + item.beatValue, 0);
            return pos >= (halfMeasure - 2.0) && pos < halfMeasure;
          });
          const allEighths = notesInHalf.every(n => n.durType === '8' && !n.isRest);
          if (allEighths) {
            targetBoundary = halfMeasure;
          }
        }

        if (currentBeam.length > 0 && noteStart >= currentBeatBoundary - 0.0001) {
          if (currentBeam.length > 1) beamGroups.push([...currentBeam]);
          currentBeam = [];
        }

        currentBeam.push(idx);
        currentBeatBoundary = targetBoundary;
      }

      currentPos = noteEnd;
    });

    if (currentBeam.length > 1) {
      beamGroups.push([...currentBeam]);
    }

    return beamGroups;
  }

  function renderScore() {
    const container = document.getElementById('notation-output');
    container.innerHTML = '';
    renderScoreToTarget(container, false);

    const fsOverlay = document.getElementById('fullscreenOverlay');
    if (fsOverlay.classList.contains('active')) {
      const fsCanvas = document.getElementById('fullscreenCanvas');
      fsCanvas.innerHTML = '';
      renderScoreToTarget(fsCanvas, true);
    }
  }

  function renderScoreToTarget(container, isFullscreen = false) {
    const rawInput = document.getElementById('rhythmInput').value;
    const flattenedParsed = parseInputToTokens(rawInput);
    if (flattenedParsed.length === 0) return;

    const beamMode = document.getElementById('beamMode').value;
    const clef = document.getElementById('clef').value;
    const isPercussion = clef === 'percussion';
    const topNum = parseInt(document.getElementById('timeSigTop').value, 10) || 4;
    const botNum = parseInt(document.getElementById('timeSigBottom').value, 10) || 4;
    const timeSig = `${topNum}/${botNum}`;
    const pitch = isPercussion ? 'b/4' : (document.getElementById('pitch').value || 'b/4');
    const measureCapacity = getMeasureCapacityInQuarterBeats();

    const measureGroups = [];
    let currentGroup = [];
    let currentMeasureBeats = 0;

    flattenedParsed.forEach((tokenObj, tokenIdx) => {
      let remainingBeatsInToken = tokenObj.beatValue;

      while (remainingBeatsInToken > 0.0001) {
        const spaceLeftInMeasure = measureCapacity - currentMeasureBeats;

        if (spaceLeftInMeasure <= 0.0001) {
          measureGroups.push(currentGroup);
          currentGroup = [];
          currentMeasureBeats = 0;
          continue;
        }

        if (remainingBeatsInToken <= spaceLeftInMeasure + 0.0001) {
          const pieces = decomposeDuration(remainingBeatsInToken, tokenObj.isRest);
          pieces.forEach((piece, pIdx) => {
            const hasTie = (!piece.isRest && (pIdx < pieces.length - 1 || tokenObj.hasTie));
            currentGroup.push({
              ...piece,
              forcedGroup: tokenObj.forcedGroup,
              sourceTokenIndex: tokenIdx,
              hasTie: hasTie
            });
          });
          currentMeasureBeats += remainingBeatsInToken;
          remainingBeatsInToken = 0;
        } else {
          const currentFitBeats = spaceLeftInMeasure;
          const fitPieces = decomposeDuration(currentFitBeats, tokenObj.isRest);

          fitPieces.forEach((piece) => {
            currentGroup.push({
              ...piece,
              forcedGroup: tokenObj.forcedGroup,
              sourceTokenIndex: tokenIdx,
              hasTie: !piece.isRest
            });
          });

          measureGroups.push(currentGroup);
          currentGroup = [];
          currentMeasureBeats = 0;
          remainingBeatsInToken -= currentFitBeats;
        }
      }
    });

    if (currentGroup.length > 0) {
      measureGroups.push(currentGroup);
    }

    const scaleFactor = isFullscreen ? 1.3 : 1.0;
    const firstMeasureBaseWidth = 130 * scaleFactor;
    const noteSpacing = 50 * scaleFactor;
    const measureWidths = measureGroups.map((group, idx) => {
      const minW = idx === 0 ? firstMeasureBaseWidth : 85 * scaleFactor;
      return Math.max(minW, group.length * noteSpacing + (idx === 0 ? 75 : 35) * scaleFactor);
    });

    const totalWidth = measureWidths.reduce((a, b) => a + b, 0) + 30;
    const totalHeight = 150 * scaleFactor;

    const renderer = new Renderer(container, Renderer.Backends.SVG);
    renderer.resize(totalWidth, totalHeight);
    const context = renderer.getContext();
    context.scale(scaleFactor, scaleFactor);

    let currentX = 10;
    const allStaveNotes = [];
    const tieIndices = [];

    measureGroups.forEach((group, mIdx) => {
      const width = measureWidths[mIdx] / scaleFactor;
      const stave = new Stave(currentX, 15, width);

      if (isPercussion) {
        stave.options.num_lines = 5;
        stave.setConfigForLines([
          { visible: false },
          { visible: false },
          { visible: true },
          { visible: false },
          { visible: false }
        ]);
      }

      if (mIdx === 0) stave.addClef(isPercussion ? 'percussion' : clef).addTimeSignature(timeSig);
      if (mIdx === measureGroups.length - 1) stave.setEndBarType(Barline.type.END);

      stave.setContext(context).draw();

      const measureNotes = group.map(p => {
        const note = new StaveNote({
          keys: [pitch],
          duration: p.vexDuration,
          clef: isPercussion ? 'percussion' : clef
        });

        if (p.isDotted) {
          Dot.buildAndAttach([note], { all: true });
        }

        const globalIdx = allStaveNotes.length;
        if (p.hasTie && !p.isRest) {
          tieIndices.push(globalIdx);
        }
        allStaveNotes.push(note);
        return note;
      });

      let beamIndexGroups = [];

      if (beamMode === 'manual') {
        const forcedGroups = {};
        group.forEach((p, idx) => {
          if (p.forcedGroup && !p.isRest && (p.durType === '8' || p.durType === '16')) {
            if (!forcedGroups[p.forcedGroup]) forcedGroups[p.forcedGroup] = [];
            forcedGroups[p.forcedGroup].push(idx);
          }
        });

        Object.values(forcedGroups).forEach(indices => {
          let chunk = [];
          for (let i = 0; i < indices.length; i++) {
            if (chunk.length === 0 || indices[i] === indices[i - 1] + 1) {
              chunk.push(indices[i]);
            } else {
              if (chunk.length > 1) beamIndexGroups.push(chunk);
              chunk = [indices[i]];
            }
          }
          if (chunk.length > 1) beamIndexGroups.push(chunk);
        });
      } else {
        beamIndexGroups = calculateAutoBeamGroups(group, topNum, botNum);
      }

      const beams = [];
      const beamedNoteSet = new Set();

      beamIndexGroups.forEach(indices => {
        const notesToBeam = indices.map(i => measureNotes[i]);
        indices.forEach(i => beamedNoteSet.add(measureNotes[i]));
        beams.push(new Beam(notesToBeam, true));
      });

      measureNotes.forEach(note => {
        if (beamedNoteSet.has(note) && note.setStem) {
          note.render_options.draw_stem = true;
          note.render_options.draw_flag = false;
        }
      });

      Formatter.FormatAndDraw(context, stave, measureNotes);
      beams.forEach(b => b.setContext(context).draw());

      measureNotes.forEach((note, localIdx) => {
        const svgElement = note.getSVGElement();
        if (svgElement) {
          svgElement.classList.add('vf-clickable-note');
          const sourceIdx = group[localIdx].sourceTokenIndex;

          if (selectedTokenIndex === sourceIdx) {
            svgElement.classList.add('selected');
          }

          svgElement.onclick = (e) => handleNoteSelect(sourceIdx, e);
        }
      });

      currentX += width;
    });

    tieIndices.forEach(idx => {
      if (idx + 1 < allStaveNotes.length) {
        const tie = new StaveTie({
          first_note: allStaveNotes[idx],
          last_note: allStaveNotes[idx + 1],
          first_indices: [0],
          last_indices: [0]
        });
        tie.setContext(context).draw();
      }
    });
  }

  function triggerIframeDownload(dataUrl, filename) {
    const a = document.createElement('a');
    a.href = dataUrl;
    a.download = filename;
    a.target = '_blank';
    document.body.appendChild(a);
    a.click();
    setTimeout(() => {
      document.body.removeChild(a);
    }, 300);
  }

  function exportSVG() {
    const svg = document.querySelector('#notation-output svg');
    if (!svg) return;
    const svgData = new XMLSerializer().serializeToString(svg);
    const svgBlob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
    const reader = new FileReader();
    reader.onload = function() {
      triggerIframeDownload(reader.result, 'rhythm-notation.svg');
    };
    reader.readAsDataURL(svgBlob);
  }

  function exportPNG() {
    const svg = document.querySelector('#notation-output svg');
    if (!svg) return;
    const svgData = new XMLSerializer().serializeToString(svg);
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    const img = new Image();

    const isTransparent = document.getElementById('exportBgMode').value === 'transparent';
    const svgBlob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
    const url = URL.createObjectURL(svgBlob);

    img.onload = function () {
      canvas.width = img.width * 2;
      canvas.height = img.height * 2;

      if (!isTransparent) {
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      ctx.scale(2, 2);
      ctx.drawImage(img, 0, 0);

      const pngUrl = canvas.toDataURL('image/png');
      triggerIframeDownload(pngUrl, 'rhythm-notation.png');
      URL.revokeObjectURL(url);
    };
    img.src = url;
  }

  // Choose a random preset on load
  const randomPreset = defaultPresets[Math.floor(Math.random() * defaultPresets.length)];
  document.getElementById('rhythmInput').value = randomPreset;
  pushHistory();

  handleClefChange();
  updatePaletteButtons();
</script>
